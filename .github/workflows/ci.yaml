name: Continuous Integration

on: 
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install poetry
        run: pipx install poetry
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'poetry'
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install --upgrade setuptools
          poetry env use ${{ matrix.python-version }}
          poetry install --all-extras
      - name: Run Tests
        run: poetry run pytest --cov nodestream --cov-report term --cov-report xml -m "not e2e"
      - name: Run Lints
        run: |
          poetry run ruff check nodestream tests
          poetry run black nodestream tests --check
          poetry run isort nodestream tests --check-only
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.python-version }}-${{ matrix.os }}

  extras-install:
    name: install (${{ matrix.args || 'no extras' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One extra at a time: an extra that needs a package from another extra fails here.
        args:
          - ""
          - "--extras aws"
          - "--extras kafka"
          - "--extras parquet"
          - "--extras prometheus"
          - "--extras validation"
    steps:
      - uses: actions/checkout@v4
      - name: Install poetry
        run: pipx install poetry
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'poetry'
      - name: Install
        # --only main skips the dev group: moto pulls in boto3 and would hide a missing guard.
        run: |
          poetry env use 3.10
          poetry install --only main ${{ matrix.args }}
      - name: Import every module
        # Fails only if a module imports an optional package without a try/except guard.
        run: >
          poetry run python -c
          "import importlib, pkgutil, nodestream;
          [importlib.import_module(m.name) for m in pkgutil.walk_packages(nodestream.__path__, 'nodestream.')]"
